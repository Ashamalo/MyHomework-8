<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <div class="wrapper">
        <div class="container clearfix">
            <div class="block">left block</div>
            <div class="block right clearfix">right block</div>
        </div>

        <div class="container clearfix">
            <div class="block">1 left block</div>
            <div class="block right">3 right block</div>
            <div class="block right">2 right block</div>
            <div class="block right">1 right block</div>
        </div>

        <div class="container clearfix">
            <div class="block">1 left block</div>
            <div class="block">2 left block</div>
            <div class="block right">2 right block</div>
            <div class="block right">1 right block</div>
        </div>

        <div class="container clearfix">
            <div class="small-container right">
                <div class="block right">2 right block</div>
                <div class="block right">3 right block</div>
            </div>
            <div class="large-block right">1 right block</div>
        </div>

        <div class="container">
            <div class="medium-container">
                <div class="small-container center">
                    <div class="block right">2 right block</div>
                    <div class="block right">3 right block</div>
                </div>
                <div class="large-block left">1 left block</div>
            </div>
        </div>

    </div>
</body>

</html>
